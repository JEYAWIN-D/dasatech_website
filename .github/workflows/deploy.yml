name: Auto Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'deploy-production'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy Live
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build

      - name: Ensure Custom Domain CNAME
        run: echo "dasatech.in" > dist/CNAME

      # 1. Automatic GitHub Pages Branch Deployment (gh-pages)
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: dasatech.in
          keep_files: false

      # 2. Native GitHub Pages Deployment (Actions Environment)
      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # 3. VPS Deployment Sync via SSH (if secrets are configured)
      - name: Sync files to production VPS server
        uses: easingthemes/ssh-deploy@main
        continue-on-error: true
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "dist/"
          REMOTE_HOST: "187.127.150.113"
          REMOTE_USER: "root"
          TARGET: "/var/www/dasatech"
          SCRIPT_AFTER: |
            chown -R www-data:www-data /var/www/dasatech
            chmod -R 755 /var/www/dasatech
